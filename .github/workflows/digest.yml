name: Morning AI News Digest

on:
  schedule:
    # 08:00 JST = 23:00 UTC
    - cron: "0 23 * * *"
  workflow_dispatch:
  # Helps GitHub register the workflow in the Actions UI on first setup
  push:
    branches: [master]
    paths:
      - ".github/workflows/digest.yml"
      - "src/**"
      - "config/**"
      - "package.json"
      - "package-lock.json"

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Restore sent cache
        id: sent-cache
        uses: actions/cache/restore@v4
        with:
          path: sent.json
          key: ai-news-sent-v1-${{ github.run_id }}
          restore-keys: |
            ai-news-sent-v1-

      - name: Run digest
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATE_PATH: sent.json
        run: npm run digest

      - name: Save sent cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: sent.json
          key: ai-news-sent-v1-${{ github.run_id }}
